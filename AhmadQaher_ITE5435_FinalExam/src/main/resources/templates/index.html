<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fill Your Details</title>
    <style>
        .form-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form th:action="@{/submit}" method="post">
            <div>
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div>
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div>
                <label for="numberOfPassengers">No. Of Passengers</label>
                <input type="number" id="numberOfPassengers" name="numberOfPassengers" min="1" value="1" required>
            </div>
            <div>
                <label for="class">Select Your Class</label>
                <select id="class" name="classType">
                    <option value="economy">Economy class</option>
                    <option value="business">Business class</option>
                    <option value="first">First class</option>
                </select>
            </div>
            <div>
                <label for="phoneNumber">Phone Number</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" required>
            </div>
            <div>
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>
            <div>
                <label for="dateOfDeparting">Date of Departing</label>
                <input type="date" id="dateOfDeparting" name="dateOfDeparting" required>
            </div>
            <div>
                <input type="submit" value="Next">
            </div>
        </form>
    </div>
</body>
</html>
