<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form Results</title>
</head>
<body>
    <h1>Form Submission Results</h1>
    <p><strong>First Name:</strong> <span th:text="${firstName}"></span></p>
    <p><strong>Last Name:</strong> <span th:text="${lastName}"></span></p>
    <p><strong>Number of Passengers:</strong> <span th:text="${numberOfPassengers}"></span></p>
    <p><strong>Class:</strong> <span th:text="${classType}"></span></p>
    <p><strong>Phone Number:</strong> <span th:text="${phoneNumber}"></span></p>
    <p><strong>Time:</strong> <span th:text="${time}"></span></p>
    <p><strong>Date of Departing:</strong> <span th:text="${dateOfDeparting}"></span></p>
    <p><strong>Price:</strong> <span th:text="${price}"></span></p>
</body>
</html>
